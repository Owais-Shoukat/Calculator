<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Calcualtor</h1>
    <div class="text">
        <input type="text" placeholder="0" disabled>
    </div>
    <div class="buttons">
        <button><i class="fa-regular fa-circle-xmark"></i></button>
        <button>AC</button>
        <button>%</button>
        <button>÷</button>

        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button>X</button>

        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button>-</button>

        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button>+</button>
        <div></div>
        <button>0</button>
        <button>.</button>
        <button>=</button>


    </div>
    
</body>
<script src="app.js"></script>
</html>
